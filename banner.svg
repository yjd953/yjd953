<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#0d1b3e"/>
      <stop offset="100%" style="stop-color:#0a0e27"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00d9ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- Neural network nodes -->
  <g filter="url(#glow)">
    <!-- Connections -->
    <line x1="100" y1="80" x2="250" y2="150" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    <line x1="100" y1="80" x2="200" y2="220" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
    <line x1="250" y1="150" x2="400" y2="100" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
    <line x1="250" y1="150" x2="420" y2="200" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
    <line x1="200" y1="220" x2="420" y2="200" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
    <line x1="400" y1="100" x2="550" y2="150" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    <line x1="420" y1="200" x2="550" y2="150" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
    <line x1="550" y1="150" x2="700" y2="80" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    <line x1="550" y1="150" x2="720" y2="220" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
    <line x1="700" y1="80" x2="850" y2="150" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
    <line x1="720" y1="220" x2="850" y2="150" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
    <line x1="850" y1="150" x2="1000" y2="100" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    <line x1="850" y1="150" x2="1020" y2="210" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
    <line x1="1000" y1="100" x2="1120" y2="160" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>

    <!-- Nodes -->
    <circle cx="100" cy="80" r="5" fill="#00d9ff" opacity="0.8"/>
    <circle cx="250" cy="150" r="6" fill="#00d9ff" opacity="0.9"/>
    <circle cx="200" cy="220" r="4" fill="#7c3aed" opacity="0.7"/>
    <circle cx="400" cy="100" r="5" fill="#7c3aed" opacity="0.8"/>
    <circle cx="420" cy="200" r="4" fill="#00d9ff" opacity="0.7"/>
    <circle cx="550" cy="150" r="7" fill="#00d9ff" opacity="1"/>
    <circle cx="700" cy="80" r="5" fill="#7c3aed" opacity="0.8"/>
    <circle cx="720" cy="220" r="4" fill="#00d9ff" opacity="0.7"/>
    <circle cx="850" cy="150" r="6" fill="#00d9ff" opacity="0.9"/>
    <circle cx="1000" cy="100" r="5" fill="#7c3aed" opacity="0.8"/>
    <circle cx="1020" cy="210" r="4" fill="#00d9ff" opacity="0.7"/>
    <circle cx="1120" cy="160" r="5" fill="#7c3aed" opacity="0.8"/>
  </g>

  <!-- Title text -->
  <text x="600" y="140" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="42" font-weight="bold" fill="#ffffff" filter="url(#glow)">Agent Engineer</text>
  <text x="600" y="185" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="20" fill="#00d9ff" opacity="0.9">@ ByteDance · LLM · RAG · Multi-Agent</text>

  <!-- Decorative bottom line -->
  <line x1="300" y1="250" x2="900" y2="250" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
</svg>
