name: Deploy engineering notes

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "README*.md"
      - "assets/site.css"
      - "assets/site.js"
      - "notes/**"
      - "posts/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build static pages
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm run build
          rm -rf node_modules
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
